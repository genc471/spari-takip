<head>
<meta charset="utf-8" />

<meta name="robots" content="noindex" />
<!-- v14 (2026-11-15): link = kimlik — müşteri bağlantısından hiçbir şey yazmadan sipariş verir: "Sipariş ver" her aşamadaki siparişte gün seçtirir (bekleyen alımı varsa WhatsApp'tan ekleme), talep uygulamada kendiliğinden siparişe döner (talep.oto); sipariş formu (siparis.html?s=KOD) bu telefonun daha önce açtığı bağlantılardan müşteriyi tanır ("Hoş geldiniz", site_known) — ad / telefon / adres sayfaya hiç gelmez. Kullanıcı: "müşteriye link gidiyor, tıkladığında bilgileri kayıtlı olsun; link üzerinden girmeyenler bilgi girsin". v13 (2026-11-15): sayfa yalnız takip değil, işe yarar — üstte hızlı düğmeler (Sipariş ver · Ara · WhatsApp; "Sipariş ver" duruma göre "Tekrar yıkat" kartına, firmanın sipariş formuna ya da WhatsApp'a gider), takip sayfasında fiyat listesi (ilk kalemler + "Tüm fiyatlar"), teslimden sonra "Komşunuza önerin" (paylaş) ve halı bakım önerileri. Kullanıcı: "sipariş ver kısmı altta kalıyor, fark edilmiyor; üst satırlara". v12 (2026-11-14): firmalar karışmaz — müşterinin ad / telefon / adres / konumu bu telefonda FİRMA KODUNA GÖRE ayrı hatırlanır (v11'in ortak kaydı silinir); "Siparişlerim" başka firmanın siparişleri araya girse de 10 kimliğe kadar dener. Sayfa firmaların kendi alan adından da açılabilir (/takip/ yükleyici, store/tracking siteBase). v11 (2026-11-13): "Siparişlerim" — müşteri elindeki herhangi bir sipariş bağlantısından / siteden önceki siparişlerini görür (customer_orders; tutar, adres, telefon yok); ad, telefon, adres ve konum bu telefonda bütün firma siteleri için ortak hatırlanır ("Unut" ile silinir). v10 (2026-11-13): silinen / iptal edilen siparişin bağlantısı hata ya da "bekleniyor" demez → "Bu sipariş kapatıldı" + firmanın sipariş formu (order_gone). v9 (2026-11-13): firma sitesi — siparis.html?s=KOD ile müşteri (yeni ya da eski) kendi siparişini verir, fiyatları görür; takip sayfasından siteye bağlantı. Aynı sayfa üç dosya olarak yayınlanır (index / tesekkur / siparis — yalnız önizleme başlığı ve kapağı farklı; scripts/make-tracking-bundle.cjs). v8: "Tekrar yıkat" kartı. v7: müşteri yanıtı kartı + "Google'da yorum yaz" + havale/EFT hesabı. Uygulama bu işaretlerle sayfanın neyi desteklediğini anlar (store/order-replies, store/order-requests) -->

<meta property="og:description" content="Hizmetimizi değerlendirin; halılarınızı yeniden yıkatmak için gününüzü seçin." />

<title>Teşekkür ederiz · Sipariş Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" />
<style>
  /* "Hat ve Durak": siparişin yolculuğu dikey bir hat, her aşama kendi renginde bir durak (uygulamayla aynı dil) */
  :root {
    --ink: #102026;
    --sub: #5b6b70;
    --faint: #8a9a9f;
    --line: #e1e8e7;
    --ground: #f1f5f4;
    --card: #ffffff;
    --teal: #0f766e;
    --teal-pale: #ccfbf1;
    --board: #14303a;
    --title: "Barlow Semi Condensed", "Arial Narrow", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --num: "Barlow Condensed", "Arial Narrow", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--ground); }
  body { margin: 0; font-family: var(--body); background: var(--ground); color: var(--ink); min-height: 100vh; }
  [hidden] { display: none !important; }

  .hero { background: linear-gradient(160deg, var(--board), var(--teal)); color: #fff; text-align: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 48px max(20px, env(safe-area-inset-left, 0px)); }
  .logo { width: 72px; height: 72px; border-radius: 20px; background: #fff; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22); }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .logo .ini { font-family: var(--title); font-size: 28px; font-weight: 700; color: var(--teal); }
  .brand { font-size: 12.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; opacity: 0.85; }
  .title { font-family: var(--title); font-weight: 700; font-size: 30px; line-height: 1.1; margin: 6px 0 0; text-wrap: balance; }

  .wrap { max-width: 480px; margin: -30px auto 0; padding: 0 max(14px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
  .card { background: var(--card); border-radius: 18px; border: 1px solid var(--line); padding: 18px; box-shadow: 0 8px 24px rgba(16, 32, 38, 0.07); margin-bottom: 12px; }

  .state { text-align: center; padding: 26px 8px; color: var(--sub); font-size: 15px; line-height: 1.5; }
  .state b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .state.gone { padding: 12px 6px; }
  .mine { list-style: none; margin: 6px 0 0; padding: 0; }
  .mine li + li { border-top: 1px solid #e5ecea; }
  .mine a { display: flex; align-items: center; gap: 12px; padding: 12px 2px; color: inherit; text-decoration: none; }
  .mine .mno { min-width: 54px; text-align: center; font: 700 15px/1 var(--title); color: var(--ink); background: #f1f5f4; border-radius: 10px; padding: 9px 6px; }
  .mine .mt { flex: 1; min-width: 0; }
  .mine .mt b { display: block; font-size: 15px; color: var(--ink); }
  .mine .mt span { display: block; font-size: 13px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mine .dot { display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-right: 7px; vertical-align: 1px; }
  .mine .go { color: var(--teal); font: 700 22px/1 var(--body); }
  .forget { color: var(--teal); font-weight: 700; text-decoration: none; }
  .spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--teal-pale); border-top-color: var(--teal); margin: 0 auto 14px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

  .cap { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; color: var(--sub); margin: 0 0 12px; }

  /* Hat: duraklar dikey çizgiyle bağlı; geçilen yol aşamanın renginde */
  .hat { list-style: none; margin: 0 0 6px; padding: 0; }
  .stop { position: relative; display: flex; gap: 14px; padding-bottom: 16px; }
  .stop:last-child { padding-bottom: 2px; }
  .stop::before { content: ""; position: absolute; left: 12px; top: 26px; bottom: -2px; width: 3px; background: var(--line); border-radius: 2px; }
  .stop:last-child::before { display: none; }
  .stop.done::before { background: var(--c); }
  .mark { flex: none; width: 27px; height: 27px; border-radius: 50%; border: 2.5px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
  .stop.done .mark { background: var(--c); border-color: var(--c); }
  .stop.done .mark svg { width: 14px; height: 14px; }
  .stop.now .mark { border-color: var(--c); box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 18%, transparent); }
  .stop.now .mark::after { content: ""; width: 11px; height: 11px; border-radius: 50%; background: var(--c); }
  .txt { flex: 1; min-width: 0; padding-top: 3px; }
  .lbl { font-size: 15px; font-weight: 600; color: var(--faint); }
  .stop.done .lbl { color: var(--ink); }
  .stop.now .lbl { font-family: var(--title); font-weight: 700; font-size: 23px; line-height: 1.1; color: var(--c); }
  .note { font-size: 14px; color: var(--sub); line-height: 1.45; margin-top: 4px; }
  .stop.now .note { color: var(--ink); }
  .when { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .stop.now .when { font-weight: 700; color: var(--ink); margin-top: 6px; }
  .here { display: inline-block; margin-left: 6px; vertical-align: 3px; font-family: var(--body); font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #fff; background: var(--c); padding: 2px 7px; border-radius: 6px; }

  .rows { border-top: 1px solid var(--line); margin-top: 8px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--sub); }
  .row .v { color: var(--ink); font-weight: 700; text-align: right; }
  .row .v.num { font-family: var(--num); font-weight: 700; font-size: 18px; line-height: 1.1; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; border: none; border-radius: 13px; padding: 14px; font: 800 16px var(--body); cursor: pointer; text-decoration: none; }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn:focus-visible { outline: 3px solid var(--teal-pale); outline-offset: 2px; }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .btn-row .btn { flex: 1; font-size: 15px; padding: 13px; }
  .btn-call { background: #fff; color: var(--teal); border: 1.5px solid var(--teal); }
  .btn-wa { background: #1fa855; color: #fff; }
  .btn-loc { background: var(--teal); color: #fff; }
  .btn-loc[disabled] { opacity: 0.6; }
  .loc-title { font-family: var(--title); font-weight: 700; font-size: 20px; margin: 0 0 4px; }
  .loc-text { font-size: 14px; color: var(--sub); margin: 0 0 14px; line-height: 1.45; }
  .loccard.hl { border: 2px solid var(--teal); }
  .ok { background: #ecf7f5; border: 1px solid #cfe7e2; color: var(--teal); border-radius: 13px; padding: 13px; font-weight: 800; font-size: 14.5px; text-align: center; }
  .err { color: #b91c1c; font-size: 13px; margin-top: 10px; text-align: center; }
  .foot { text-align: center; margin-top: 16px; font-size: 12px; color: var(--sub); }

  /* Müşteri yanıtı (v7): alış / teslim günü evde olacak mı */
  .replycard.hl { border: 2px solid var(--teal); }
  .btn-no { background: #fff; color: #b91c1c; border: 1.5px solid #fecaca; }
  .btn-row.ask { margin-top: 0; }
  .ok.no { background: #fff7ed; border-color: #fed7aa; color: #9a3412; }

  /* Puan (teslim edilen siparişte): 5 yıldız + isteğe bağlı yorum */
  .ratecard.hl { border: 2px solid #f59e0b; }
  .stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 6px; }
  .star { width: 50px; height: 50px; border: none; background: none; padding: 4px; cursor: pointer; color: #d6dfdd; -webkit-tap-highlight-color: transparent; }
  .star svg { width: 100%; height: 100%; fill: currentColor; display: block; }
  .star.on { color: #f59e0b; }
  .star:focus-visible { outline: 3px solid #fde68a; outline-offset: 1px; border-radius: 10px; }
  .stars.static .star { width: 34px; height: 34px; padding: 2px; cursor: default; }
  .stxt { text-align: center; font-family: var(--title); font-weight: 700; font-size: 17px; color: var(--ink); min-height: 22px; margin-bottom: 10px; }
  .rnote { width: 100%; min-height: 72px; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font: 15px var(--body); color: var(--ink); resize: vertical; margin-bottom: 12px; }
  .rnote:focus { outline: none; border-color: var(--teal); }
  .quote { text-align: center; font-size: 14.5px; color: var(--sub); margin: 6px 0 12px; line-height: 1.45; }
  /* Google yorumu: puan verildikten sonra, kaç yıldız verilirse verilsin aynı düğme */
  .gask { text-align: center; font-size: 14.5px; color: var(--ink); margin: 4px 0 12px; line-height: 1.45; }
  .ghint { text-align: center; font-size: 12.5px; color: var(--sub); margin: 8px 0 0; line-height: 1.4; }
  .rate-more { margin-top: 10px; }
  /* Havale / EFT: ödenmemiş siparişte firma hesabı (firma ayarı açıksa). Tutar yazılmaz. */
  .acct { border-top: 1px solid var(--line); padding: 13px 0 2px; }
  .acct:first-of-type { border-top: none; padding-top: 0; }
  .acct .bn { font-weight: 800; font-size: 15px; color: var(--ink); }
  .acct .hd { font-size: 13.5px; color: var(--sub); margin-top: 1px; }
  .acct .ib { font: 700 16px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--ink); letter-spacing: 0.3px; margin: 8px 0 11px; word-break: break-all; }

  /* Linkten sipariş (v8): teslim edilmiş siparişte "tekrar yıkat" — gün seç, isteğe bağlı parça ve not */
  .reqcard.hl { border: 2px solid var(--teal); }
  .days { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 14px; }
  .day { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 9px 12px; text-align: left; cursor: pointer; font: inherit; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  .day .dw { display: block; font-weight: 800; font-size: 15px; }
  .day .dn { display: block; font-size: 13px; color: var(--sub); margin-top: 1px; }
  .day.on { background: var(--teal); border-color: var(--teal); color: #fff; }
  .day.on .dn { color: #d5f5ef; }
  .day:focus-visible { outline: 3px solid var(--teal-pale); outline-offset: 2px; }
  .pcs { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .pcs .pk { flex: 1; font-size: 14.5px; font-weight: 700; color: var(--ink); }
  .pcs .pk small { display: block; font-weight: 400; font-size: 12.5px; color: var(--sub); margin-top: 1px; }
  .pcs button { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; font: 700 22px/1 var(--body); color: var(--teal); cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent; }
  .pcs button:focus-visible { outline: 3px solid var(--teal-pale); outline-offset: 2px; }
  .pcs .pn { min-width: 36px; text-align: center; font: 700 24px/1 var(--num); color: var(--ink); }
  .pcs .pn.none { color: var(--faint); }
  .btn-loc.next { margin-top: 12px; }

  /* Firma sitesi (v9): müşteri kendi siparişini verir (siparis.html?s=KOD) + fiyat listesi */
  .fld { display: block; margin: 0 0 12px; }
  .fld .fl { display: block; font-size: 13.5px; font-weight: 700; color: var(--ink); margin: 0 0 6px; }
  .fld .fl small { font-weight: 400; color: var(--sub); }
  .fld input, .fld textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; font: 16px var(--body); color: var(--ink); background: #fff; }
  .fld textarea { min-height: 76px; resize: vertical; }
  .fld input:focus, .fld textarea:focus { outline: none; border-color: var(--teal); }
  .fld.bad input, .fld.bad textarea { border-color: #f87171; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .btn-pin { background: #fff; color: var(--teal); border: 1.5px dashed var(--teal); padding: 11px; font-size: 14.5px; margin: -2px 0 16px; }
  .btn-pin.on { border-style: solid; background: #ecf7f5; }
  .sec { font-size: 13.5px; font-weight: 700; color: var(--ink); margin: 2px 0 8px; }
  .plist { margin: 0; padding: 0; list-style: none; }
  .plist li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .plist li:last-child { border-bottom: none; }
  .plist .pv { font-family: var(--num); font-weight: 700; font-size: 19px; white-space: nowrap; }
  .plist .pv small { font-family: var(--body); font-size: 12.5px; font-weight: 600; color: var(--sub); margin-left: 3px; }
  .pnote { font-size: 13px; color: var(--sub); line-height: 1.45; margin: 10px 0 0; }
  .sitelink { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
  .sitelink b { display: block; font-size: 15px; }
  .sitelink span { display: block; font-size: 13px; color: var(--sub); margin-top: 2px; }
  .sitelink .go { margin-left: auto; color: var(--teal); font: 700 26px/1 var(--body); }

  /* v13: üstte hızlı düğmeler — "Sipariş ver" ilk bakışta görünsün (eskiden en altta küçük bir satırdı) */
  .quick { display: flex; gap: 8px; max-width: 452px; margin: 18px auto 0; }
  .qb { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 48px; padding: 0 8px;
    border-radius: 14px; border: 1.5px solid rgba(255, 255, 255, 0.38); background: rgba(255, 255, 255, 0.1); color: #fff;
    font: 800 15px var(--body); text-decoration: none; white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .qb svg { width: 17px; height: 17px; flex: none; }
  .qb.main { flex: 1.45; background: #fff; border-color: #fff; color: var(--teal); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); }
  .qb:focus-visible { outline: 3px solid #99f6e4; outline-offset: 2px; }
  @media (max-width: 374px) { .qb { font-size: 14px; gap: 5px; padding: 0 6px; } .qb svg { width: 15px; height: 15px; } }
  /* Fiyat listesi takip sayfasında kısa: ilk kalemler + "Tüm fiyatlar" */
  .pmore { display: block; width: 100%; margin-top: 10px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff;
    color: var(--teal); font: 800 15px var(--body); cursor: pointer; }
  /* Komşunuza önerin (teslimden sonra) */
  .sharecard { background: linear-gradient(150deg, #ffffff 55%, #ecf7f5); }
  .btn-share { background: var(--teal); color: #fff; }
  /* Halı bakım önerileri */
  .tips { list-style: none; margin: 4px 0 0; padding: 0; counter-reset: t; }
  .tips li { position: relative; padding: 10px 0 10px 38px; border-bottom: 1px solid var(--line); font-size: 14.5px; line-height: 1.45; color: var(--ink); counter-increment: t; }
  .tips li:last-child { border-bottom: none; }
  .tips li::before { content: counter(t); position: absolute; left: 0; top: 9px; width: 26px; height: 26px; border-radius: 9px; background: #ecf7f5;
    color: var(--teal); font: 700 15px/26px var(--num); text-align: center; }
  .tips li b { display: block; font-size: 15px; margin-bottom: 1px; }
  /* Bildirim (v13): "Haber verelim mi?" — açıkken tek satır */
  .pushon { display: flex; align-items: center; gap: 12px; }
  .pushon > svg { width: 26px; height: 26px; color: var(--teal); flex: none; }
  .pushon div { flex: 1; min-width: 0; }
  .pushon b { display: block; font-size: 15px; }
  .pushon span { display: block; font-size: 13px; color: var(--sub); margin-top: 2px; line-height: 1.4; }
  .linkbtn { border: none; background: none; color: var(--teal); font: 800 14px var(--body); padding: 8px 4px; cursor: pointer; }
  .card.slim { padding: 14px 16px; }
</style>
</head>
<body>
  <header class="hero">
    <div class="logo" id="logo" hidden></div>
    <div class="brand" id="brand">Sipariş Takip</div>
    <h1 class="title" id="htitle">Halınız nerede?</h1>
    <nav class="quick" id="quick" hidden aria-label="Hızlı işlemler"></nav>
  </header>
  <main class="wrap">
    <section class="card" id="gonecard" hidden aria-live="polite"></section>
    <section class="card" id="card" aria-live="polite">
      <div class="state"><div class="spinner"></div>Sorgulanıyor…</div>
    </section>
    <section class="card replycard" id="replycard" hidden aria-live="polite"></section>
    <section class="card loccard" id="loccard" hidden></section>
    <section class="card paycard" id="paycard" hidden></section>
    <section class="card pushcard" id="pushcard" hidden aria-live="polite"></section>
    <section class="card ratecard" id="ratecard" hidden></section>
    <section class="card sharecard" id="sharecard" hidden></section>

      renderRequest(r, false);

      // WhatsApp'tan "o güne ekleme" (ikinci alım açılmaz)
      quick.req = !!r.destek;
      quick.alinacak = !r.destek && r.alinacak ? String(r.alinacak).slice(0, 10) : "";
      renderQuick();
    }).catch(hideRequest);
  }
  function openRequest() {
    if (!reqState) return;
    reqOpened = true;
    renderRequest(reqState.info, false);
    var box = document.getElementById("reqcard");
    box.classList.add("hl");
    box.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function parseYmd(s) { var p = String(s).slice(0, 10).split("-"); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
  // "Yarın, 12 Kasım Perşembe" (bugün / yarın sunucunun gününe göre)
  function dayLong(s, base) {
    var t = ymd(base);
    var tm = ymd(new Date(base.getFullYear(), base.getMonth(), base.getDate() + 1));
    return (s === t ? "Bugün, " : s === tm ? "Yarın, " : "") + fmtDate(s);
  }
  // Seçilebilir günler: bugünden başlayarak 8 açık gün. Bugün yalnız 14.00'e kadar (sonrası yetişmez) — mesajdaki gün
  // bugünse ya da müşterinin önceki seçimiyse yine sunulur.
  function requestDays(info, keep) {
    var base = /^\d{4}-\d{2}-\d{2}$/.test(String(info.bugun || "")) ? parseYmd(info.bugun) : new Date();
    var closed = Array.isArray(info.kapali) ? info.kapali : [];
    var out = [];
    for (var i = 0; i < 24 && out.length < 8; i++) {
      var d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
      var s = ymd(d);
      if (closed.indexOf(d.getDay()) >= 0) continue;
      if (i === 0 && new Date().getHours() >= 14 && s !== wantsDay && s !== keep) continue;
      out.push({ s: s, d: d, w: i === 0 ? "Bugün" : i === 1 ? "Yarın" : DAYS[d.getDay()] });
    }
    return { base: base, list: out };
  }
  // ctx (v14, sipariş formunda "Hoş geldiniz"): { known: true, box, id, site, extra } — yoksa takip sayfasının kartı
  function renderRequest(info, edit, ctx) {
    var known = !!(ctx && ctx.known);
    var box = known ? ctx.box : document.getElementById("reqcard");
    var oid = known ? ctx.id : orderId;
    var delivered = known || !reqState || reqState.delivered;
    var extra = known ? ctx.extra || "" : "";
    var sendLabel = known ? "Sipariş ver" : "Gönder";
    var t = info.talep && typeof info.talep === "object" ? info.talep : null;
    var base = /^\d{4}-\d{2}-\d{2}$/.test(String(info.bugun || "")) ? parseYmd(info.bugun) : new Date();
    // Kart en üste (yolculuk kartının önüne): bağlantı talep içinse ya da müşterinin süren bir talebi / yeni siparişi
    // varsa — sayfayı onun için açmıştır. Yoksa form en altta, puan kartından sonra durur.
    function toTop() {
      if (known || reqPlaced) return;
      reqPlaced = true;
      box.parentNode.insertBefore(box, document.getElementById("card"));
    }
    // Formdaki "Formu doldurarak sipariş ver" (başka biri için, bilgiler değişti) → tam form
    function bindKnown() {
      var b = known ? document.getElementById("knownform") : null;
      if (b) b.onclick = function () { renderSite(ctx.site, null, false); };
    }
    if (wantsRequest) toTop();
    box.classList.remove("hl");
    // 1) Açık talep var: alındı bilgisi (+ gün değiştirme). oto: uygulama kendiliğinden siparişe çevirir → teyit beklenmez
    if (t && t.durum === "yeni" && !edit) {
      toTop();
      box.hidden = false;
      box.innerHTML = '<p class="loc-title">' + (t.oto ? "Siparişiniz alındı" : "Talebiniz alındı") + '</p>' +
        '<div class="ok">' + esc(dayLong(String(t.gun).slice(0, 10), base)) +
        (t.oto ? ' halılarınızı almaya geleceğiz' : ' için alım talebiniz bize ulaştı') +
        (t.adet ? ' (' + esc(t.adet) + ' parça)' : '') + '.' + (t.oto ? '' : ' Teyit için size haber vereceğiz.') + '</div>' +
        (info.destek ? '<div class="btn-row"><button class="btn btn-call" id="reqchange">Günü değiştir</button></div>' : '') + extra;
      var ch = document.getElementById("reqchange");
      if (ch) ch.onclick = function () { renderRequest(info, true, ctx); };
      bindKnown();
      return;
    }
    // 2) Talep siparişe çevrildi ve o sipariş sürüyor: yeni siparişin sayfasına götür
    if (t && t.durum === "siparis" && !info.destek) {
      toTop();
      box.hidden = false;
      if (t.siparis) rememberOrder(String(t.siparis));
      box.innerHTML = '<p class="loc-title">Siparişiniz oluşturuldu</p>' +
        '<div class="ok">' + (t.gun ? esc(dayLong(String(t.gun).slice(0, 10), base)) + ' halılarınızı almaya geliyoruz. ' : '') + 'Teşekkür ederiz!</div>' +
        (t.siparis ? '<a class="btn btn-loc next" href="./?id=' + encodeURIComponent(t.siparis) + '">' + (known ? "Halınızı takip edin" : "Yeni siparişi takip et") + '</a>' : '') + extra;
      bindKnown();
      return;
    }
    if (!info.destek) {
      // Bekleyen alımı var (ikinci alım açılmaz): formda bilgi; takip sayfasında kart gizli — üstteki "Sipariş ver"
      // WhatsApp'tan "o güne ekleme" der
      if (known && info.alinacak) {
        box.hidden = false;
        box.innerHTML = '<p class="loc-title">Hoş geldiniz</p>' +
          '<div class="ok">' + esc(dayLong(String(info.alinacak).slice(0, 10), base)) + ' alınacak bir siparişiniz var. Eklemek istediğiniz halı varsa bize yazın.</div>' + extra;
        bindKnown();
        return;
      }
      box.hidden = true;
      return;
    }
    // Teslim edilmemiş siparişin sayfasında kart ancak üstteki "Sipariş ver" ile açılır (yolculuk kartının önüne geçmesin)
    if (!known && !delivered && !wantsRequest && !reqOpened && !edit) { box.hidden = true; return; }
    // 3) Form: gün (zorunlu) + parça ve not (isteğe bağlı)
    var editing = !!(edit && t);
    var keep = editing ? String(t.gun).slice(0, 10) : "";
    var days = requestDays(info, keep).list;
    if (!days.length) { box.hidden = true; return; }
    var has = function (s) { return days.some(function (x) { return x.s === s; }); };
    var pick = keep && has(keep) ? keep : wantsDay && has(wantsDay) ? wantsDay : "";
    var pcs = editing && t.adet ? Number(t.adet) || 0 : 0;
    box.hidden = false;
    box.classList.toggle("hl", wantsRequest);
    box.innerHTML =
      '<p class="loc-title">' + (editing ? "Günü değiştirin" : known ? "Hoş geldiniz 👋" : delivered ? "Halılarınızı yine yıkayalım mı?" : "Yeni alım") + '</p>' +
      '<p class="loc-text">' + (known ? "Bilgileriniz kayıtlı: gün seçin, halılarınızı adresinizden alalım. Aramanıza gerek yok."
        : "Gün seçin, halılarınızı adresinizden alalım. Aramanıza gerek yok.") + '</p>' +
      '<div class="days" id="reqdays" role="radiogroup" aria-label="Alış günü">' +
        days.map(function (x) {
          return '<button type="button" class="day" role="radio" data-d="' + x.s + '"><span class="dw">' + esc(x.w) +
            '</span><span class="dn">' + x.d.getDate() + ' ' + MONTHS[x.d.getMonth()] + '</span></button>';
        }).join("") +
      '</div>' +
      '<div class="pcs"><span class="pk">Kaç parça?<small>İsteğe bağlı</small></span>' +
        '<button type="button" id="pcminus" aria-label="Azalt">−</button><span class="pn" id="pcn" aria-live="polite"></span>' +
        '<button type="button" id="pcplus" aria-label="Artır">+</button></div>' +
      '<textarea class="rnote" id="reqnote" maxlength="300" placeholder="' +
        (known ? "Notunuz (isteğe bağlı): uygun saat, zil; adresiniz değiştiyse yeni adres" : "Notunuz (isteğe bağlı): uygun saat, kat, zil…") + '">' +
        esc(editing ? t.not || "" : "") + '</textarea>' +
      '<button class="btn btn-loc" id="reqbtn"></button><div id="reqmsg"></div>' + extra;
    bindKnown();
    var chips = box.querySelectorAll("#reqdays .day");
    function paint() {
      Array.prototype.forEach.call(chips, function (b) {
        var on = b.getAttribute("data-d") === pick;
        b.classList.toggle("on", on);
        b.setAttribute("aria-checked", on ? "true" : "false");
      });
      var pn = document.getElementById("pcn");
      pn.textContent = pcs > 0 ? String(pcs) : "—";
      pn.classList.toggle("none", pcs <= 0);
      var btn = document.getElementById("reqbtn");
      btn.disabled = !pick;
      btn.textContent = pick ? sendLabel : "Önce gün seçin";
    }
    Array.prototype.forEach.call(chips, function (b) {
      b.onclick = function () { pick = b.getAttribute("data-d"); paint(); };
    });
    document.getElementById("pcminus").onclick = function () { pcs = Math.max(0, pcs - 1); paint(); };
    document.getElementById("pcplus").onclick = function () { pcs = Math.min(99, pcs + 1); paint(); };
    paint();
    document.getElementById("reqbtn").onclick = function () {
      var btn = document.getElementById("reqbtn");
      var msg = document.getElementById("reqmsg");
      var note = document.getElementById("reqnote").value.trim();
      if (!pick) return;
      btn.disabled = true; btn.textContent = "Gönderiliyor…"; msg.innerHTML = "";
      rpc("request_order", { p_order: oid, p_day: pick, p_pieces: pcs > 0 ? pcs : null, p_note: note || null })
        .then(function (r) {
          if (r && r.ok) {
            // talep kimliği döndüyse site talebi: uygulama kendiliğinden siparişe çevirir (v14)
            info.talep = { gun: pick, adet: pcs > 0 ? pcs : null, not: note || null, durum: "yeni", siparis: null, oto: !!r.talep };
            renderRequest(info, false, ctx);
            return;
          }
          btn.disabled = false; btn.textContent = sendLabel;
          var why = r && r.hata;
          msg.innerHTML = '<div class="err">' + (why === "kapali_gun" ? "Seçtiğiniz gün kapalıyız. Lütfen başka bir gün seçin."
            : why === "gun" ? "Bu gün seçilemiyor. Lütfen başka bir gün seçin."
            : why === "acik" ? (r.gun ? esc(fmtDate(r.gun)) + " alınacak bir siparişiniz zaten var." : "Alınacak bir siparişiniz zaten var.") + " Eklemek için bize yazın."
            : why === "isleniyor" ? "Siparişiniz şu an hazırlanıyor. Değişiklik için bizi arayın."
            : why === "tekrar" ? "Siparişiniz zaten gönderildi. Sayfayı yenileyip kontrol edin."
            : "Talebiniz kaydedilemedi. Lütfen firmayı arayın.") + '</div>';
        })
        .catch(function () {
          btn.disabled = false; btn.textContent = sendLabel;
          msg.innerHTML = '<div class="err">Bağlantı hatası, tekrar deneyin.</div>';
        });
    };
  }

  // ── Havale / EFT (track_order → banka / makbuz; ProTakip "takip sayfasında IBAN") ──
  // Müşteri "IBAN'ı atar mısınız" diye aramadan hesabı görür, tek dokunuşla kopyalar. Tutar burada YAZMAZ (hesap fişinde).
  function ibanGroups(s) { return String(s || "").replace(/\s+/g, "").toUpperCase().replace(/(.{4})/g, "$1 ").trim(); }
  function renderBank(list, receiptNo) {
    var box = document.getElementById("paycard");
    var rows = (Array.isArray(list) ? list : []).filter(function (a) { return a && a.iban; });
    if (!rows.length) { box.hidden = true; return; }

      '<p class="loc-title">Havale / EFT ile ödeme</p>' +

        (receiptNo ? ' Açıklamaya fiş numaranızı yazın: <b>' + esc(receiptNo) + '</b>' : '') + '</p>' +
      rows.map(function (a, i) {
        return '<div class="acct">' +
          (a.banka ? '<div class="bn">' + esc(a.banka) + '</div>' : '') +

          '<div class="ib">' + esc(ibanGroups(a.iban)) + '</div>' +
          '<button class="btn btn-call" data-i="' + i + '">IBAN\'ı kopyala</button></div>';
      }).join("");
    Array.prototype.forEach.call(box.querySelectorAll("button[data-i]"), function (btn) {
      btn.onclick = function () {
        var a = rows[Number(btn.getAttribute("data-i"))];
        copyText(String(a.iban).replace(/\s+/g, ""), function () {
          btn.textContent = "Kopyalandı ✓";
          setTimeout(function () { btn.textContent = "IBAN'ı kopyala"; }, 2500);

  function starsHtml(n) {
    var s = "";
    for (var i = 1; i <= 5; i++) s += '<span class="star' + (i <= n ? " on" : "") + '">' + STAR + '</span>';
    return s;
  }

  function renderRating(given, comment, highlight) {
    var box = document.getElementById("ratecard");
    box.hidden = false;
    box.classList.toggle("hl", !!highlight);
    if (given) {
      box.innerHTML =
        '<p class="loc-title">Değerlendirmeniz için teşekkürler</p>' +

        (comment ? '<p class="quote">“' + esc(comment) + '”</p>' : "") +
        // Google'da yorum: kaç yıldız verilirse verilsin aynı düğme (yalnız memnun müşteriyi yönlendirmek Google
        // kurallarına aykırı). Yorum yazıldıysa dokununca panoya alınır, Google'da yapıştırmak yeter.
        (googleUrl
          ? '<p class="gask">Görüşünüzü Google\'da da paylaşır mısınız?</p>' +

            (comment ? '<p class="ghint" id="ghint">Dokununca yazdığınız yorum kopyalanır; Google\'da yapıştırmanız yeterli.</p>' : "")
          : "") +

  function ratingForm(cur, comment) {

      '<p class="loc-title">Hizmetimizi değerlendirin</p>' +

  function renderLocation(highlight) {
    var box = document.getElementById("loccard");
    box.hidden = false;
    box.classList.toggle("hl", !!highlight);
    box.innerHTML =
      '<p class="loc-title">Adresinizi kolay bulalım</p>' +
      '<p class="loc-text">Halıların alınacağı / teslim edileceği adresteyken aşağıdaki düğmeye basın; konumunuz yalnızca bu firmaya iletilir.</p>' +
      '<button class="btn btn-loc" id="locbtn">' + PIN + 'Konumumu gönder</button><div id="locmsg"></div>';
    document.getElementById("locbtn").onclick = sendLocation;

  function resetLocBtn(btn) { btn.disabled = false; btn.innerHTML = PIN + "Konumumu gönder"; }

  function sendLocation() {
    var btn = document.getElementById("locbtn");
    var msg = document.getElementById("locmsg");
    msg.innerHTML = "";
    if (!navigator.geolocation) { msg.innerHTML = '<div class="err">Bu tarayıcı konum paylaşamıyor.</div>'; return; }
    btn.disabled = true; btn.textContent = "Konum alınıyor…";
    navigator.geolocation.getCurrentPosition(function (pos) {
      rpc("share_order_location", { p_order_id: orderId, p_lat: pos.coords.latitude, p_lng: pos.coords.longitude, p_acc: pos.coords.accuracy || null })
        .then(function (r) {
          if (r && r.ok) {
            document.getElementById("loccard").innerHTML = '<div class="ok">Konumunuz iletildi. Teşekkür ederiz!</div>';
          } else {
            resetLocBtn(btn);
            msg.innerHTML = '<div class="err">Konum kaydedilemedi. Lütfen firmayı arayın.</div>';
          }
        })
        .catch(function () {
          resetLocBtn(btn);
          msg.innerHTML = '<div class="err">Bağlantı hatası, tekrar deneyin.</div>';
        });
    }, function (err) {
      resetLocBtn(btn);
      msg.innerHTML = '<div class="err">' + (err && err.code === 1 ? "Konum izni verilmedi. Tarayıcı ayarlarından konuma izin verip tekrar deneyin." : "Konum alınamadı, tekrar deneyin.") + '</div>';
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }

  // ── Firma sitesi (v9; siparis.html?s=KOD, supabase/firma-sitesi.sql) ──
  // Müşteri — yeni ya da eski — kendi siparişini verir, fiyatları görür. Talep firma uygulamasına düşer, uygulama onu
  // doğrudan siparişe çevirir. Gönderilen talebin kimliği bu telefonda saklanır: yeniden açınca "alındı" / "siparişiniz
  // oluşturuldu → takip" görünür; ad, telefon, adres sonraki siparişte hazır gelir.
  var siteCode = String(new URLSearchParams(window.location.search).get("s") || "").trim().toUpperCase().slice(0, 12);
  var SITE_KEY = "halitakip.site." + siteCode;
  var sitePin = null; // "Konumumu ekle": { lat, lng }
  function siteSaved() { try { return JSON.parse(localStorage.getItem(SITE_KEY) || "null") || {}; } catch (e) { return {}; } }
  function siteSave(o) { try { localStorage.setItem(SITE_KEY, JSON.stringify(o)); } catch (e) {} }
  // Müşterinin kendi bilgileri BU TELEFONDA, FİRMA KODUNA GÖRE ayrı (v12, 14 Kasım): ad, telefon, adres, konum.
  // Sayfa bütün firmalarda ortak; v11'de bilgiler firmalar arasında ortaktı → aynı telefondan başka bir firmanın formu
  // açılınca öbür firmaya yazılan ad / adres hazır geliyordu. Kullanıcı: "satacağımız firmaların bilgileri
  // karışmaması lazım". Eski ortak kayıt (hangi firmaya yazıldığı bilinmez) taşınmaz, silinir.
  // Sunucuya telefonla SORULMAZ (başkasının numarasını yazan onun adresini görürdü).
  function kisiKey() { return "halitakip.kisi." + siteCode; }
  try { localStorage.removeItem("halitakip.kisi"); } catch (e) {}
  function kisi() { try { return JSON.parse(localStorage.getItem(kisiKey()) || "null") || {}; } catch (e) { return {}; } }
  function kisiSave(o) { try { localStorage.setItem(kisiKey(), JSON.stringify(o)); } catch (e) {} }
  // Bu telefonda görülen siparişler (takip bağlantısı açıldı / siteden verildi): "Siparişlerim" bunlardan biriyle sorulur
  var SIP_KEY = "halitakip.siparisler";
  function knownOrders() {
    try {
      var a = JSON.parse(localStorage.getItem(SIP_KEY) || "[]");
      return Array.isArray(a) ? a.filter(function (x) { return typeof x === "string" && x; }) : [];
    } catch (e) { return []; }
  }
  function rememberOrder(id) {
    if (!id) return;
    var a = knownOrders().filter(function (x) { return x !== id; });
    a.unshift(String(id));
    try { localStorage.setItem(SIP_KEY, JSON.stringify(a.slice(0, 10))); } catch (e) {}
  }
  // "Siparişlerim" (customer_orders, v11): müşterinin bu firmadaki siparişleri — durum, gün, ürünler (tutar yok).
  // Takip sayfasında "Diğer siparişleriniz" (açılan sipariş hariç), firma sitesinde "Siparişlerim".
  function stopOf(k) {
    for (var i = 0; i < STOPS.length; i++) if (STOPS[i].key === k) return STOPS[i];
    return { now: k || "", c: "#64748b" };
  }
  function renderMine(list, title) {
    var box = document.getElementById("mycard");

  function loadMine(ids, code, exclude, title) {

    // bu firmanın siparişine ulaşana dek sırayla denenir (eskiden ilk 3: araya giren başka firma listeyi boşaltıyordu)
    var tries = ids.slice(0, 10);
    (function next() {
      var id = tries.shift();
      if (!id) return;
      rpc("customer_orders", { p_order: id, p_code: code || null }).then(function (r) {
        if (!r || !r.bulundu || !Array.isArray(r.siparisler)) { next(); return; }
        renderMine(r.siparisler.filter(function (x) { return x && x.id && x.id !== exclude; }), title);
      }).catch(function () {});
    })();

  function tlPrice(v) {

  function siteCall(info) {

  // short (v13, takip sayfası): önce ilk 5 kalem, "Tüm fiyatlar (N)" ile hepsi — sayfa fiyat listesine boğulmasın

      }).join("") + '</ul>';
    }
    var main = list.filter(function (p) { return !p.hizmet; });

  function renderSite(info, req, edit) {

    var saved = siteSaved();
    // Kişi bilgileri telefonda ortak (v11); v9–v10'un firma koduna göre kaydettiği bir kez taşınır

    // 2) Firma siparişe çevirdi: takip bağlantısı
    if (req && req.durum === "siparis" && !edit) {
      if (req.siparis) rememberOrder(req.siparis);
      box.innerHTML = '<p class="loc-title">Siparişiniz oluşturuldu</p>' +
        '<div class="ok">' + esc(dayLong(day, base)) + ' halılarınızı almaya geliyoruz. Teşekkür ederiz!</div>' +
        (req.siparis ? '<a class="btn btn-loc next" href="./?id=' + encodeURIComponent(req.siparis) + '">Halınızı takip edin</a>' : '') +

    var has = function (s) { return days.some(function (x) { return x.s === s; }); };
    var pick = edit && has(day) ? day : wantsDay && has(wantsDay) ? wantsDay : "";
    var pcs = edit && req && req.adet ? Number(req.adet) || 0 : 0;
    // Önceki siparişin konumu: adres aynı kaldıkça kendiliğinden eklenir; adres değişirse düşer (başka adrese sipariş)
    if (!sitePin && me.adres && isFinite(me.lat) && isFinite(me.lng) && me.lat !== null && me.lng !== null) {
      sitePin = { lat: Number(me.lat), lng: Number(me.lng), eski: true };
    }
    box.innerHTML =
      '<p class="loc-title">' + (edit ? "Siparişinizi değiştirin" : "Halılarınızı kapınızdan alalım") + '</p>' +
      '<p class="loc-text">Bilgilerinizi yazın, gün seçin. Siparişiniz doğrudan bize ulaşır; aramanıza gerek yok.</p>' +
      '<label class="fld" id="f-ad"><span class="fl">Adınız soyadınız</span><input id="s-ad" autocomplete="name" maxlength="60" value="' + esc(me.ad || "") + '"></label>' +
      '<label class="fld" id="f-tel"><span class="fl">Cep telefonunuz</span><input id="s-tel" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="05xx xxx xx xx" value="' + esc(me.tel || "") + '"></label>' +
      '<label class="fld" id="f-adres"><span class="fl">Adresiniz</span><textarea id="s-adres" autocomplete="street-address" maxlength="300" placeholder="Mahalle, sokak, kapı no, daire">' + esc(me.adres || "") + '</textarea></label>' +
      '<button type="button" class="btn btn-pin" id="s-pin"></button>' +
      '<p class="sec">Hangi gün alalım?</p>' +
      '<div class="days" id="s-days" role="radiogroup" aria-label="Alış günü">' +
        days.map(function (x) {
          return '<button type="button" class="day" role="radio" data-d="' + x.s + '"><span class="dw">' + esc(x.w) +
            '</span><span class="dn">' + x.d.getDate() + ' ' + MONTHS[x.d.getMonth()] + '</span></button>';
        }).join("") +
      '</div>' +
      '<div class="pcs"><span class="pk">Kaç parça?<small>Bilmiyorsanız boş bırakın</small></span>' +
        '<button type="button" id="s-minus" aria-label="Azalt">−</button><span class="pn" id="s-pcn" aria-live="polite"></span>' +
        '<button type="button" id="s-plus" aria-label="Artır">+</button></div>' +
      '<label class="fld"><span class="fl">Notunuz <small>(isteğe bağlı)</small></span><textarea id="s-not" maxlength="300" placeholder="Uygun saat, kat, zil, halının durumu…">' + esc(edit && req && req.not ? req.not : "") + '</textarea></label>' +
      '<div class="hp" aria-hidden="true"><label>Web sitesi <input id="s-hp" tabindex="-1" autocomplete="off"></label></div>' +
      '<button class="btn btn-loc" id="s-send"></button><div id="s-msg"></div>' +
      (me.ad ? '<p class="pnote">Bilgileriniz bir dahaki sipariş için bu telefonda hatırlanır. <a href="#" class="forget" id="s-forget">Unut</a></p>' : '');
    var chips = box.querySelectorAll("#s-days .day");
    function paint() {
      Array.prototype.forEach.call(chips, function (b) {

      var pn = document.getElementById("s-pcn");
      pn.textContent = pcs > 0 ? String(pcs) : "—";
      pn.classList.toggle("none", pcs <= 0);
      var pin = document.getElementById("s-pin");
      pin.classList.toggle("on", !!sitePin);
      pin.innerHTML = PIN + (sitePin ? (sitePin.eski ? "Önceki konumunuz eklendi ✓" : "Konumunuz eklendi ✓") : "Konumumu ekle (isteğe bağlı)");

    document.getElementById("s-pin").onclick = function () {

      }, function () {
        pin.disabled = false; paint();

      }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    };
    // Adres değişince önceki siparişin konumu düşer (başka adrese sipariş: şoför eski kapıya gitmesin)

      if (adres.replace(/\s+/g, " ").length < 8) errs.push(["f-adres", "adres"]);

  // v14 "Hoş geldiniz" (link = kimlik): bu telefon bu firmanın bir sipariş bağlantısını daha önce açtıysa (takip
  // linki, WhatsApp) form doldurtulmaz — gün seçilir, talep o bağlantıyla verilir (request_order; ad / telefon / adres
  // firmanın kayıtlarından, sayfaya hiç gelmez). site_known yalnız bu kodun firmasının (markasının) kimliğini döndürür.
  // Tanınmazsa ya da bir şey ters giderse her zamanki form.
  function siteStart(info) {
    var ids = knownOrders();
    if (!info.acik || !ids.length) { renderSite(info, null, false); return; }
    rpc("site_known", { p_code: siteCode, p_orders: ids.slice(0, 10) }).then(function (k) {
      if (!k || !k.siparis) { renderSite(info, null, false); return; }
      return rpc("request_info", { p_order: k.siparis }).then(function (ri) {
        if (!ri || typeof ri.destek !== "boolean") { renderSite(info, null, false); return; }
        var extra = '<div class="btn-row"><button class="btn btn-call" id="knownform">Formu doldurarak sipariş ver</button>' + siteCall(info) + '</div>';
        renderRequest(ri, false, { known: true, box: document.getElementById("card"), id: String(k.siparis), site: info, extra: extra });
      });
    }).catch(function () { renderSite(info, null, false); });
  }
  function loadSite() {
    var card = document.getElementById("card");
    document.getElementById("htitle").textContent = "Halı yıkama siparişi";
    document.title = "Halı Yıkama Siparişi";

      if (!info || !info.bulundu) {
        card.innerHTML = '<div class="state"><b>Bağlantı geçersiz</b>Lütfen firmanızdan yeni bağlantı isteyin.</div>';

      if (info.firma_adi) document.getElementById("brand").textContent = info.firma_adi;

      quick.firma = info.firma_adi || "";
      quick.kod = siteCode;
      quick.form = true;
      renderQuick();
      pageReady = true;

      loadMine(knownOrders(), siteCode, null, "Siparişlerim");

      rpc("site_request", { p_id: t }).then(function (r) {

  // Takip sayfasından firmanın sitesine — firmanın kodu varsa ve firma siteyi açtıysa. v13: en alttaki "Fiyatlarımız ·
  // yeni sipariş" bağlantısı yerine üstteki "Sipariş ver" o formu açar, fiyat listesi (açıksa) burada kısa gösterilir.

  // ── Hızlı düğmeler (v13): Sipariş ver · Ara · WhatsApp — sayfanın en üstünde ──
  // "Sipariş ver" nereye gider: teslim edilmiş siparişte "Tekrar yıkat" kartı (form yok, müşteri tanınıyor) → firmanın
  // sipariş formu (site açıksa) → WhatsApp (hazır mesajla). Alınacak siparişte form "zaten alınacak siparişiniz var"
  // derdi → WhatsApp'tan "ekleme yapmak istiyorum".
  var quick = { tel: "", status: "", firma: "", kod: "", req: false, form: false, alinacak: "" };
  function waLink(tel, text) { return "https://wa.me/" + phoneDigits(tel) + (text ? "?text=" + encodeURIComponent(text) : ""); }
  function orderTarget() {
    if (quick.form) return null; // sipariş formunun kendisi (siparis.html?s=KOD): yalnız Ara · WhatsApp
    if (quick.req) return { card: "reqcard" };
    // v14: bekleyen alımı var (bu ya da başka siparişi) → ikinci alım açılmaz, o güne ekleme yazılır
    if (quick.alinacak && quick.tel) return { href: waLink(quick.tel, "Merhaba, " + fmtDate(quick.alinacak) + " alınacak siparişime ekleme yapmak istiyorum.") };
    if (quick.status === "Teslim alınacak" && quick.tel) return { href: waLink(quick.tel, "Merhaba, alınacak siparişime ekleme yapmak istiyorum.") };
    if (quick.kod) return { href: "./siparis.html?s=" + encodeURIComponent(quick.kod) };
    if (quick.tel) return { href: waLink(quick.tel, "Merhaba, halı yıkama siparişi vermek istiyorum.") };

  function renderQuick() {

    if (quick.tel) {
      html += '<a class="qb" href="tel:' + esc(quick.tel) + '">' + PHONE + 'Ara</a>' +
        '<a class="qb" href="' + esc(waLink(quick.tel)) + '">WhatsApp</a>';

    nav.innerHTML = html;
    nav.hidden = !html;
    var a = document.getElementById("qorder");

        e.preventDefault();
        openRequest();
      };
    }
  }

  // ── Komşunuza önerin (v13, teslimden sonra): firmanın sipariş adresi paylaşılır (WhatsApp ya da telefonun paylaş
  // menüsü). Firmanın kendi sitesinde açıldıysa (/takip/ yükleyici → window.TAKIP_SITE.home) o sitenin adresi.
  function shareUrl() {
    var site = typeof SITE.home === "string" ? SITE.home : "";
    if (/^https:\/\//.test(site)) return site;
    if (quick.kod) {
      try { return new URL("./siparis.html?s=" + encodeURIComponent(quick.kod), window.location.href).href; } catch (e) {}
    }
    return "";
  }
  function renderShare() {
    var box = document.getElementById("sharecard");
    var url = shareUrl();
    var firma = quick.firma || "Bu firmayı";
    var tel = quick.tel ? String(quick.tel).replace(/^\+?90/, "0") : "";
    if (!url && !tel) { box.hidden = true; return; }
    // Firma adına ek getirilmez (her adda doğru ek kurulamaz): "Halı yıkama için tavsiye ederim: Gençoğlu Halı Yıkama."
    var text = "Halı yıkama için tavsiye ederim: " + firma + ". " +
      (url ? "Gününüzü seçip buradan sipariş verebilirsiniz: " + url : "Sipariş için: " + tel);
    box.innerHTML = '<p class="loc-title">Komşunuza önerin</p>' +
      '<p class="loc-text">Memnun kaldıysanız komşularınıza ve yakınlarınıza gönderin; onlar da gün seçip kolayca sipariş versin.</p>' +
      '<button class="btn btn-share" id="sharebtn">' + SHARE + 'Önerin</button><div id="sharemsg"></div>';
    box.hidden = false;
    document.getElementById("sharebtn").onclick = function () {
      // Telefonun paylaş menüsü (WhatsApp, SMS…); yoksa WhatsApp
      if (navigator.share) {
        navigator.share({ title: firma, text: text }).catch(function () {});
        return;
      }
      window.location.href = "https://wa.me/?text=" + encodeURIComponent(text);
    };
  }

  // ── Halı bakım önerileri (v13, teslimden sonra) — her firmaya uyan genel bilgiler ──
  var TIPS = [
    ["Poşette bekletmeyin", "Halınızı geldiği gün serin ya da poşetten çıkarıp havalandırın; kapalı poşette uzun kalan halı nem çekip kokabilir."],
    ["Lekeyi ovmayın", "Temiz, nemli bir bezle bastırarak alın. Ovmak lekeyi yayar, tüyleri bozar."],
    ["Haftada bir süpürün", "Liflerin arasına yerleşen toz halıyı çabuk yıpratır ve rengini soldurur."],
    ["Yönünü çevirin", "Yılda bir iki kez halının yönünü değiştirin; güneş ve yürüme yolu tek tarafı yıpratmasın."],
    ["Yılda bir yıkatın", "Evde küçük çocuk ya da evcil hayvan varsa altı ayda bir yıkatmanız daha sağlıklıdır."]
  ];
  function renderTips() {
    var box = document.getElementById("tipcard");
    box.innerHTML = '<p class="loc-title">Halınız uzun süre temiz kalsın</p><ol class="tips">' +
      TIPS.map(function (t) { return '<li><b>' + esc(t[0]) + '</b>' + esc(t[1]) + '</li>'; }).join("") + '</ol>';
    box.hidden = false;
  }

  // ── Bildirim (v13, supabase/web-bildirim.sql + sw.js): "Haber verelim mi?" ──
  // Müşteri izin verirse bu tarayıcı siparişin MÜŞTERİSİNE bağlanır: halı hazır olunca, yola çıkınca, teslimde (ve sonraki
  // siparişlerinde) firmanın telefonu tarayıcıya bildirim gönderir. Sunucu desteklemiyorsa (SQL yok / firma kapattı),
  // tarayıcı desteklemiyorsa (iPhone'da ana ekrana eklenmemiş Safari, uygulama içi tarayıcı) ya da izin reddedildiyse
  // kart çıkmaz. Soru yalnız teslim edilmemiş siparişte sorulur; açıksa her aşamada tek satır + "Kapat".
  var PUSH_KEY = "BCkt9hx0IouIUDAtNR_3RysSwhh3wFqxFkazwsEZxEfTfzrTCFxgxy61iPpWTk46lxG42phprnTtCC5ugFQUdnA";
  var PUSH_BOX = "halitakip-bildirim";
  function pushCapable() {
    return !!(window.isSecureContext && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window);
  }
  function b64uBytes(s) {
    var pad = "====".slice(0, (4 - (s.length % 4)) % 4);
    var raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  // Servis çalışanına not: hangi siparişin bağlantısından abone olundu (tarayıcı adresi yenilerse yeniden kaydolur)
  function pushNote(endpoint) {
    try {
      caches.open(PUSH_BOX).then(function (c) {
        return endpoint ? c.put("abone", new Response(JSON.stringify({ siparis: orderId, endpoint: endpoint }))) : c.delete("abone");
      }).catch(function () {});
    } catch (e) {}
  }
  var pushDelivered = false;
  // Servis çalışanı (sw.js) bu sayfanın yanında mı: ortak sayfada (GitHub) sayfayla birlikte yüklenir; firmanın kendi
  // sitesinde yükleyici "push: true" der (o sitede /takip/sw.js varsa). Yoksa kart hiç çıkmaz — eksik yüklemede müşteri
  // "Evet"e basıp hata görmesin.
  function swHere() {
    return /(^|\.)github\.io$/i.test(window.location.hostname) || SITE.push === true;
  }
  function loadPush(data) {
    var box = document.getElementById("pushcard");
    pushDelivered = data.durum === "Teslim edildi";
    if (!pushCapable() || !swHere() || Notification.permission === "denied") { box.hidden = true; return; }
    navigator.serviceWorker.getRegistration("./").then(function (reg) {
      return reg ? reg.pushManager.getSubscription() : null;
    }).then(function (sub) {
      return rpc("push_state", { p_order: orderId, p_endpoint: sub ? sub.endpoint : null }).then(function (st) {
        if (!st || !st.destek) { box.hidden = true; return; }
        var on = !!(st.abone && sub && Notification.permission === "granted");
        if (!on && pushDelivered) { box.hidden = true; return; }
        renderPush(on);
      });
    }).catch(function () { box.hidden = true; });
  }
  function renderPush(on, err) {
    var box = document.getElementById("pushcard");
    box.classList.toggle("slim", on);
    if (on) {
      box.innerHTML = '<div class="pushon">' + BELL + '<div><b>Bildirimler açık</b><span>' +
        (pushDelivered ? "Sonraki siparişlerinizde de haber vereceğiz." : "Halılarınız hazır olunca ve yola çıkınca haber vereceğiz.") +
        '</span></div><button type="button" class="linkbtn" id="pushoff">Kapat</button></div>';
      document.getElementById("pushoff").onclick = pushOff;
    } else {
      box.innerHTML = '<p class="loc-title">Haber verelim mi?</p>' +
        '<p class="loc-text">Halılarınız hazır olunca ve yola çıkınca telefonunuza bildirim gönderelim. İstediğiniz zaman kapatabilirsiniz.</p>' +
        '<button class="btn btn-loc" id="pushbtn">' + BELL + 'Evet, haber ver</button><div id="pushmsg">' + (err ? '<div class="err">' + esc(err) + '</div>' : '') + '</div>';
      document.getElementById("pushbtn").onclick = pushOn;
    }
    box.hidden = false;
  }
  function pushOn() {
    var btn = document.getElementById("pushbtn");
    btn.disabled = true;
    btn.textContent = "İzin bekleniyor…";
    // İzin sorusu dokunuşun hemen ardından sorulmalı (tarayıcı kuralı): önce izin, sonra servis çalışanı
    Promise.resolve(Notification.requestPermission()).then(function (perm) {
      if (perm !== "granted") throw new Error(perm === "denied" ? "red" : "vazgecti");
      btn.textContent = "Açılıyor…";
      return navigator.serviceWorker.register("./sw.js", { scope: "./" });
    }).then(function () {
      return navigator.serviceWorker.ready;
    }).then(function (reg) {
      return reg.pushManager.getSubscription().then(function (s) {
        return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uBytes(PUSH_KEY) });
      });
    }).then(function (sub) {
      var keys = (sub.toJSON() || {}).keys || {};
      return rpc("push_subscribe", { p_order: orderId, p_endpoint: sub.endpoint, p_p256dh: keys.p256dh || null, p_auth: keys.auth || null }).then(function (r) {
        if (!r || !r.ok) throw new Error("kayit");
        pushNote(sub.endpoint);
        renderPush(true);
      });
    }).catch(function (e) {
      var why = e && e.message;
      if (why === "red") { document.getElementById("pushcard").hidden = true; return; }
      renderPush(false, why === "vazgecti" ? "" : "Bildirimler açılamadı. Lütfen biraz sonra yeniden deneyin.");
    });
  }
  function pushOff() {
    navigator.serviceWorker.getRegistration("./").then(function (reg) {
      return reg ? reg.pushManager.getSubscription() : null;
    }).then(function (sub) {
      if (!sub) return null;
      var ep = sub.endpoint;
      return sub.unsubscribe().then(function () { return rpc("push_unsubscribe", { p_endpoint: ep }); });
    }).then(function () {
      pushNote(null);
      if (pushDelivered) document.getElementById("pushcard").hidden = true;
      else renderPush(false);
    }).catch(function () {
      renderPush(false, "Kapatılamadı. Lütfen yeniden deneyin.");
    });
  }

  // ── Ana ekrana ekle (v13): firmanın kendi sitesinde (bildirge varsa) Chrome izin verince — siparişler, fiyatlar ve yeni
  // sipariş telefonda uygulama gibi tek dokunuşta. Tarayıcının kendi alt şeridi yerine kart (yerinde, sayfa okunduktan sonra).
  var installEvt = null;
  var pageReady = false;
  if (typeof window.addEventListener === "function") {
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      installEvt = e;
      renderInstall();
    });
    window.addEventListener("appinstalled", function () {
      installEvt = null;
      document.getElementById("installcard").hidden = true;
    });
  }
  function renderInstall() {
    var box = document.getElementById("installcard");
    if (!installEvt || !pageReady) { box.hidden = true; return; }
    var name = quick.firma || "Firmamızı";
    box.innerHTML = '<p class="loc-title">Ana ekranınıza ekleyin</p>' +
      '<p class="loc-text">' + esc(name) + ' telefonunuzda uygulama gibi dursun: siparişleriniz, fiyatlar ve yeni sipariş tek dokunuşta.</p>' +
      '<button class="btn btn-call" id="installbtn">' + HOME + 'Ana ekrana ekle</button>';
    box.hidden = false;
    document.getElementById("installbtn").onclick = function () {
      var ev = installEvt;
      if (!ev) return;
      installEvt = null;
      ev.prompt();
      Promise.resolve(ev.userChoice).then(function () { box.hidden = true; }).catch(function () { box.hidden = true; });
    };
  }

  // Silinen / iptal edilen sipariş (order_gone, v10): hata ya da "bekleniyor" yerine kısa not + firmanın sipariş formu
  // (site açıksa aynı sayfada); site kapalıysa ara / WhatsApp. Kullanıcı 13 Kasım: "programdan sipariş silinse dahi
  // hata vermesin, linke tıklayınca en azından sipariş oluştur desin".
  function renderGone(g) {
    if (g.firma_adi) document.getElementById("brand").textContent = g.firma_adi;
    showLogo(g.firma_logo, g.firma_adi);
    var what = g.iptal ? "Bu sipariş iptal edildi" : "Bu sipariş kapatıldı";
    var note = document.getElementById("gonecard");
    if (g.kod) {
      note.innerHTML = '<div class="state gone"><b>' + what + '</b>Yeni sipariş vermek için aşağıdan gününüzü seçin; halılarınızı alalım.</div>';
      note.hidden = false;
      siteCode = String(g.kod).toUpperCase();
      SITE_KEY = "halitakip.site." + siteCode;
      loadSite();
      return;
    }
    note.hidden = true;
    document.getElementById("htitle").textContent = "Yeni sipariş";
    document.title = "Yeni sipariş · Sipariş Takip";
    var tel = phoneDigits(g.firma_tel);
    document.getElementById("card").innerHTML = '<div class="state"><b>' + what + '</b>Yeni sipariş için bizi arayın ya da WhatsApp\'tan yazın.</div>' +
      (tel ? '<div class="btn-row">' + siteCall(g) + '<a class="btn btn-wa" href="https://wa.me/' + tel + '?text=' +
        encodeURIComponent("Merhaba, halı yıkama siparişi vermek istiyorum.") + '">WhatsApp</a></div>' : '');
    document.getElementById("foot").textContent = "";
  }

  // Sipariş az önce oluşturulduysa (mesaj hemen gider) sunucuya ulaşması birkaç saniye sürebilir: bulunamazsa önce
  // silinmiş / iptal edilmiş mi diye bakılır (öyleyse beklemeden yeni sipariş), değilse birkaç kez daha sorulur.
  function load(attempt) {
    rpc("track_order", { order_id: orderId })
      .then(function (data) {
        if (data && data.bulundu) { render(data); return; }
        return rpc("order_gone", { p_order: orderId })
          .then(function (g) { return g; }, function () { return null; })
          .then(function (g) {
            if (g && g.silindi) { renderGone(g); return; }
            if (attempt < 3) {
              document.getElementById("card").innerHTML = '<div class="state"><div class="spinner"></div>Sipariş bilgisi bekleniyor…</div>';
              setTimeout(function () { load(attempt + 1); }, 4000);
              return;
            }
            render(data);
          });
      })
      .catch(function () {
        document.getElementById("card").innerHTML = '<div class="state"><b>Bağlantı hatası</b>İnternetinizi kontrol edip tekrar deneyin.</div>';
      });
  }

  // Ana ekrandaki simgeden açılış (bildirgedeki start_url ?app=1): bu telefonun en son sipariş bağlantısı; hiç yoksa
  // firmanın sipariş formu (yükleyicinin verdiği kod)
  var appMode = new URLSearchParams(window.location.search).get("app") === "1";
  if (siteCode && !orderId) loadSite();
  else if (!orderId && appMode && knownOrders().length) window.location.replace("./?id=" + encodeURIComponent(knownOrders()[0]) + "&app=1");
  else if (!orderId && appMode && typeof SITE.kod === "string" && /^[A-Za-z0-9]{4,12}$/.test(SITE.kod)) {
    siteCode = SITE.kod.toUpperCase();
    SITE_KEY = "halitakip.site." + siteCode;
    loadSite();
  }
  else if (!orderId) render(null);
  else load(0);
</script>
</body>
</html>
