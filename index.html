<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sipariş Takip</title>
<style>
  :root {
    --ink: #102026;
    --ink-soft: #17313a;
    --primary: #0f766e;
    --primary-bright: #14b8a6;
    --primary-pale: #ccfbf1;
    --slate: #64748b;
    --border: #e2e8f0;
    --surface: #f8f9fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--surface);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .hero {
    width: 100%;
    background: linear-gradient(135deg, var(--ink-soft), var(--ink));
    padding: 28px 20px 22px;
    text-align: center;
    color: #fff;
  }
  .hero .brand { font-size: 15px; font-weight: 700; opacity: 0.85; letter-spacing: 0.3px; }
  .hero .title { font-size: 21px; font-weight: 900; margin-top: 4px; }
  .wrap { width: 100%; max-width: 460px; padding: 18px 16px 40px; }
  .card {
    background: #fff;
    border-radius: 18px;
    border: 1px solid var(--border);
    padding: 20px;
    box-shadow: 0 4px 14px rgba(16, 32, 38, 0.06);
  }
  .state { text-align: center; padding: 30px 10px; color: var(--slate); font-size: 14.5px; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid var(--primary-pale); border-top-color: var(--primary);
    margin: 0 auto 14px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .company { font-size: 13px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--primary-pale); color: var(--primary);
    font-weight: 900; font-size: 17px;
    padding: 10px 18px; border-radius: 14px; margin-bottom: 18px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); }
  .timeline { display: flex; align-items: center; margin-bottom: 20px; }
  .step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
  .step .circle {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--border); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #fff; font-weight: 900; z-index: 1;
  }
  .step.done .circle { background: var(--primary); border-color: var(--primary); }
  .step.current .circle { background: var(--primary-bright); border-color: var(--primary-bright); box-shadow: 0 0 0 4px var(--primary-pale); }
  .step .line { position: absolute; top: 10px; left: -50%; width: 100%; height: 2px; background: var(--border); z-index: 0; }
  .step:first-child .line { display: none; }
  .step.done .line, .step.current .line { background: var(--primary); }
  .step .label { font-size: 9.5px; color: var(--slate); font-weight: 700; margin-top: 5px; text-align: center; line-height: 1.2; }
  .step.done .label, .step.current .label { color: var(--ink); }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
  .row:first-of-type { border-top: none; }
  .row .k { color: var(--slate); font-weight: 600; }
  .row .v { color: var(--ink); font-weight: 800; text-align: right; max-width: 60%; }
  .foot { text-align: center; margin-top: 18px; font-size: 12px; color: var(--slate); }
</style>
</head>
<body>
  <div class="hero">
    <div class="brand">SİPARİŞ TAKİP</div>
    <div class="title">Halınız Nerede?</div>
  </div>
  <div class="wrap">
    <div class="card" id="card">
      <div class="state"><div class="spinner"></div>Sorgulanıyor…</div>
    </div>
    <div class="foot">Bu link sadece bu siparişin durumunu gösterir.</div>
  </div>

<script>
  var SUPABASE_URL = "https://hxldnojokckqgxecyxhc.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_ZTqkY2ZJPKqtJo5eNycwAA_owbOKT52";

  var STEPS = [
    { key: "Teslim alınacak", label: "Alınacak", short: "A" },
    { key: "Yıkamada", label: "Yıkamada", short: "Y" },
    { key: "Hazır", label: "Hazır", short: "H" },
    { key: "Teslim edilecek", label: "Teslimde", short: "T" },
    { key: "Araçta", label: "Araçta", short: "A" },
    { key: "Teslim edildi", label: "Teslim Edildi", short: "✓" },
  ];

  function fmtDate(s) {
    if (!s) return "—";
    var p = String(s).split("-");
    if (p.length !== 3) return s;
    var months = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
    return Number(p[2]) + " " + (months[Number(p[1]) - 1] || "") + " " + p[0];
  }

  function render(data) {
    var card = document.getElementById("card");
    if (!data || !data.bulundu) {
      card.innerHTML = '<div class="state">😕 Sipariş bulunamadı.<br/>Link geçersiz olabilir, firmanızla iletişime geçin.</div>';
      return;
    }
    var idx = STEPS.findIndex(function (s) { return s.key === data.durum; });
    var stepsHtml = STEPS.map(function (s, i) {
      var cls = i < idx ? "done" : i === idx ? "current" : "";
      return '<div class="step ' + cls + '"><div class="line"></div><div class="circle">' +
        (i < idx ? "✓" : s.short) + '</div><div class="label">' + s.label + '</div></div>';
    }).join("");

    var rows = "";
    if (data.alis_tarihi) rows += '<div class="row"><div class="k">Alış Tarihi</div><div class="v">' + fmtDate(data.alis_tarihi) + '</div></div>';
    if (data.teslim_tarihi) rows += '<div class="row"><div class="k">Teslim Tarihi</div><div class="v">' + fmtDate(data.teslim_tarihi) + '</div></div>';
    if (data.urun_ozet) rows += '<div class="row"><div class="k">Ürünler</div><div class="v">' + data.urun_ozet + '</div></div>';

    card.innerHTML =
      (data.firma_adi ? '<div class="company">' + data.firma_adi + '</div>' : '') +
      '<div class="status-badge"><span class="dot"></span>' + (data.durum || "—") + '</div>' +
      '<div class="timeline">' + stepsHtml + '</div>' +
      rows;
  }

  var id = new URLSearchParams(window.location.search).get("id");
  if (!id) {
    render(null);
  } else {
    fetch(SUPABASE_URL + "/rest/v1/rpc/track_order", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ order_id: id }),
    })
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () {
        document.getElementById("card").innerHTML = '<div class="state">Bağlantı hatası. İnternetinizi kontrol edip tekrar deneyin.</div>';
      });
  }
</script>
</body>
</html>
