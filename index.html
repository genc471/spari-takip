<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0f766e" />
<meta name="description" content="Siparişinizi adım adım takip edin, konumunuzu tek dokunuşla iletin." />
<!-- WhatsApp / bağlantı önizleme kartı -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Sipariş Takip" />
<meta property="og:locale" content="tr_TR" />
<meta property="og:title" content="Halınız nerede? 📍" />
<meta property="og:description" content="Siparişinizi adım adım takip edin, konumunuzu tek dokunuşla iletin." />
<meta property="og:image" content="https://genc471.github.io/spari-takip/kapak.png" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<title>Halınız Nerede? · Sipariş Takip</title>
<style>
  :root {
    --ink: #102026;
    --ink-soft: #17313a;
    --primary: #0f766e;
    --primary-bright: #14b8a6;
    --primary-pale: #ccfbf1;
    --slate: #64748b;
    --border: #e2e8f0;
    --surface: #f4f6f8;
    --green: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--surface);
    color: var(--ink);
    min-height: 100vh;
  }
  .hero {
    background: linear-gradient(135deg, var(--ink-soft), var(--primary));
    padding: 26px 20px 46px;
    text-align: center;
    color: #fff;
  }
  .logo { width: 76px; height: 76px; border-radius: 22px; background: #fff; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22); }
  .logo[hidden] { display: none; }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .logo .ini { font-size: 28px; font-weight: 900; color: var(--primary); letter-spacing: 0.5px; }
  .hero .brand { font-size: 13px; font-weight: 800; opacity: 0.85; letter-spacing: 1px; text-transform: uppercase; }
  .hero .title { font-size: 23px; font-weight: 900; margin-top: 6px; }
  .wrap { max-width: 480px; margin: -30px auto 0; padding: 0 14px 40px; }
  .card {
    background: #fff; border-radius: 20px; border: 1px solid var(--border);
    padding: 20px; box-shadow: 0 8px 24px rgba(16, 32, 38, 0.08); margin-bottom: 12px;
  }
  .state { text-align: center; padding: 26px 8px; color: var(--slate); font-size: 15px; line-height: 1.5; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--primary-pale); border-top-color: var(--primary); margin: 0 auto 14px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--primary-pale); color: var(--primary); font-weight: 900; font-size: 18px; padding: 10px 18px; border-radius: 14px; }
  .status-line { font-size: 14px; color: var(--slate); margin: 10px 0 18px; line-height: 1.45; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--primary); }
  .timeline { display: flex; align-items: flex-start; margin: 4px 0 18px; }
  .step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
  .step .circle { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; font-weight: 900; z-index: 1; }
  .step.done .circle { background: var(--primary); border-color: var(--primary); }
  .step.current .circle { background: var(--primary-bright); border-color: var(--primary-bright); box-shadow: 0 0 0 5px var(--primary-pale); }
  .step .line { position: absolute; top: 12px; left: -50%; width: 100%; height: 3px; background: var(--border); z-index: 0; }
  .step:first-child .line { display: none; }
  .step.done .line, .step.current .line { background: var(--primary); }
  .step .label { font-size: 10.5px; color: var(--slate); font-weight: 700; margin-top: 6px; text-align: center; line-height: 1.2; }
  .step.done .label, .step.current .label { color: var(--ink); }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .row:first-of-type { border-top: none; }
  .row .k { color: var(--slate); font-weight: 600; }
  .row .v { color: var(--ink); font-weight: 800; text-align: right; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; border: none; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 900; cursor: pointer; text-decoration: none; }
  .btn-loc { background: var(--primary); color: #fff; }
  .btn-loc[disabled] { opacity: 0.6; }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  .btn-row .btn { flex: 1; font-size: 15px; padding: 13px; }
  .btn-call { background: #e6f5f2; color: var(--primary); }
  .btn-wa { background: #25d366; color: #fff; }
  .loc-title { font-size: 16px; font-weight: 900; margin: 0 0 4px; }
  .loc-text { font-size: 13.5px; color: var(--slate); margin: 0 0 14px; line-height: 1.45; }
  .ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: var(--green); border-radius: 14px; padding: 13px; font-weight: 800; font-size: 14.5px; text-align: center; }
  .err { color: #b91c1c; font-size: 13px; margin-top: 10px; text-align: center; }
  .foot { text-align: center; margin-top: 16px; font-size: 12px; color: var(--slate); }
</style>
</head>
<body>
  <div class="hero">
    <div class="logo" id="logo" hidden></div>
    <div class="brand" id="brand">Sipariş Takip</div>
    <div class="title">Halınız Nerede?</div>
  </div>
  <div class="wrap">
    <div class="card" id="card">
      <div class="state"><div class="spinner"></div>Sorgulanıyor…</div>
    </div>
    <div class="card" id="loccard" style="display:none"></div>
    <div class="foot">Bu bağlantı yalnızca bu siparişin durumunu gösterir.</div>
  </div>

<script>
  var SUPABASE_URL = "https://hxldnojokckqgxecyxhc.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_ZTqkY2ZJPKqtJo5eNycwAA_owbOKT52";

  var STEPS = [
    { key: "Teslim alınacak", label: "Alınacak", short: "1" },
    { key: "Yıkamada", label: "Yıkanıyor", short: "2" },
    { key: "Hazır", label: "Hazır", short: "3" },
    { key: "Teslim edilecek", label: "Teslimatta", short: "4" },
    { key: "Araçta", label: "Yolda", short: "5" },
    { key: "Teslim edildi", label: "Teslim Edildi", short: "✓" },
  ];
  // Müşteriye her aşamada ne olduğu sade dille
  var LINES = {
    "Teslim alınacak": "Halılarınızı belirtilen gün adresinizden alacağız.",
    "Yıkamada": "Halılarınız tesisimizde yıkanıyor ve kurutuluyor.",
    "Hazır": "Halılarınız hazır, paketlendi. Teslimat için sizi arayacağız.",
    "Teslim edilecek": "Halılarınız teslimat listesinde. Teslim günü sizi arayacağız.",
    "Araçta": "Halılarınız araçta, adresinize doğru yoldayız.",
    "Teslim edildi": "Halılarınız teslim edildi. Bizi tercih ettiğiniz için teşekkürler!"
  };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function fmtDate(s) {
    if (!s) return "—";
    var p = String(s).split("-");
    if (p.length !== 3) return s;
    var months = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
    return Number(p[2]) + " " + (months[Number(p[1]) - 1] || "") + " " + p[0];
  }

  function phoneDigits(p) {
    var d = String(p || "").replace(/\D/g, "");
    if (d.indexOf("0") === 0) d = "90" + d.slice(1);
    else if (d.length === 10) d = "90" + d;
    return d;
  }

  function rpc(name, body) {
    return fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify(body),
    }).then(function (r) { return r.json(); });
  }

  var orderId = new URLSearchParams(window.location.search).get("id");
  var wantsLocation = new URLSearchParams(window.location.search).get("konum") === "1";

  // Firma logosu; yoksa ya da açılamazsa firma adının baş harfleri. Yalnız https adresi kabul edilir.
  function showLogo(url, name) {
    var box = document.getElementById("logo");
    function initials() {
      var ini = String(name || "").trim().split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0); }).join("").toLocaleUpperCase("tr-TR");
      if (!ini) { box.hidden = true; return; }
      box.innerHTML = '<span class="ini">' + esc(ini) + '</span>';
      box.hidden = false;
    }
    if (!url || !/^https:\/\//.test(url)) { initials(); return; }
    var img = new Image();
    img.alt = name || "Logo";
    img.onload = function () { box.innerHTML = ""; box.appendChild(img); box.hidden = false; };
    img.onerror = initials;
    img.src = url;
  }

  function render(data) {
    var card = document.getElementById("card");
    if (!data || !data.bulundu) {
      card.innerHTML = '<div class="state">😕 Sipariş bulunamadı.<br/>Bağlantı eski olabilir; lütfen firmanızla iletişime geçin.</div>';
      return;
    }
    if (data.firma_adi) document.getElementById("brand").textContent = data.firma_adi;
    showLogo(data.firma_logo, data.firma_adi);
    var idx = STEPS.findIndex(function (s) { return s.key === data.durum; });
    var stepsHtml = STEPS.map(function (s, i) {
      var cls = i < idx ? "done" : i === idx ? "current" : "";
      return '<div class="step ' + cls + '"><div class="line"></div><div class="circle">' + (i < idx ? "✓" : s.short) + '</div><div class="label">' + s.label + '</div></div>';
    }).join("");

    var rows = "";
    if (data.alis_tarihi) rows += '<div class="row"><div class="k">Alış</div><div class="v">' + fmtDate(data.alis_tarihi) + '</div></div>';
    if (data.teslim_tarihi && data.durum !== "Teslim edildi") rows += '<div class="row"><div class="k">Tahmini teslim</div><div class="v">' + fmtDate(data.teslim_tarihi) + '</div></div>';
    if (data.parca) rows += '<div class="row"><div class="k">Parça</div><div class="v">' + esc(data.parca) + ' adet</div></div>';
    if (data.urun_ozet) rows += '<div class="row"><div class="k">Ürünler</div><div class="v">' + esc(data.urun_ozet) + '</div></div>';

    var contact = "";
    if (data.firma_tel) {
      contact = '<div class="btn-row">' +
        '<a class="btn btn-call" href="tel:' + esc(String(data.firma_tel).replace(/\s/g, "")) + '">📞 Ara</a>' +
        '<a class="btn btn-wa" href="https://wa.me/' + phoneDigits(data.firma_tel) + '">WhatsApp</a>' +
        '</div>';
    }

    card.innerHTML =
      '<div class="status-badge"><span class="dot"></span>' + esc(data.durum || "—") + '</div>' +
      '<div class="status-line">' + esc(LINES[data.durum] || "") + '</div>' +
      '<div class="timeline">' + stepsHtml + '</div>' +
      rows + contact;

    // Konum paylaşımı: teslim edilmemiş siparişte göster (firma istediyse en üstte vurgulu)
    if (data.durum !== "Teslim edildi") renderLocation(data, wantsLocation);
  }

  function renderLocation(data, highlight) {
    var box = document.getElementById("loccard");
    box.style.display = "block";
    if (highlight) box.style.border = "2px solid #14b8a6";
    box.innerHTML =
      '<p class="loc-title">📍 Adresinizi kolay bulalım</p>' +
      '<p class="loc-text">Halıların alınacağı / teslim edileceği adresteyken aşağıdaki düğmeye basın; konumunuz yalnızca bu firmaya iletilir.</p>' +
      '<button class="btn btn-loc" id="locbtn">📍 Konumumu Gönder</button><div id="locmsg"></div>';
    document.getElementById("locbtn").onclick = sendLocation;
  }

  function sendLocation() {
    var btn = document.getElementById("locbtn");
    var msg = document.getElementById("locmsg");
    msg.innerHTML = "";
    if (!navigator.geolocation) { msg.innerHTML = '<div class="err">Bu tarayıcı konum paylaşamıyor.</div>'; return; }
    btn.disabled = true; btn.textContent = "Konum alınıyor…";
    navigator.geolocation.getCurrentPosition(function (pos) {
      rpc("share_order_location", { p_order_id: orderId, p_lat: pos.coords.latitude, p_lng: pos.coords.longitude, p_acc: pos.coords.accuracy || null })
        .then(function (r) {
          if (r && r.ok) {
            document.getElementById("loccard").innerHTML = '<div class="ok">✓ Konumunuz iletildi. Teşekkür ederiz!</div>';
          } else {
            btn.disabled = false; btn.textContent = "📍 Konumumu Gönder";
            msg.innerHTML = '<div class="err">Konum kaydedilemedi. Lütfen firmayı arayın.</div>';
          }
        })
        .catch(function () {
          btn.disabled = false; btn.textContent = "📍 Konumumu Gönder";
          msg.innerHTML = '<div class="err">Bağlantı hatası, tekrar deneyin.</div>';
        });
    }, function (err) {
      btn.disabled = false; btn.textContent = "📍 Konumumu Gönder";
      msg.innerHTML = '<div class="err">' + (err && err.code === 1 ? "Konum izni verilmedi. Tarayıcı ayarlarından konuma izin verip tekrar deneyin." : "Konum alınamadı, tekrar deneyin.") + '</div>';
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }

  // Sipariş az önce oluşturulduysa (mesaj hemen gider) sunucuya ulaşması birkaç saniye sürebilir:
  // bulunamazsa birkaç kez daha sorulur.
  function load(attempt) {
    rpc("track_order", { order_id: orderId })
      .then(function (data) {
        if ((!data || !data.bulundu) && attempt < 3) {
          document.getElementById("card").innerHTML = '<div class="state"><div class="spinner"></div>Sipariş bilgisi bekleniyor…</div>';
          setTimeout(function () { load(attempt + 1); }, 4000);
          return;
        }
        render(data);
      })
      .catch(function () {
        document.getElementById("card").innerHTML = '<div class="state">Bağlantı hatası. İnternetinizi kontrol edip tekrar deneyin.</div>';
      });
  }

  if (!orderId) render(null);
  else load(0);
</script>
</body>
</html>
